<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>천호산업 홈페이지 관리</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Crect%20x%3D%225%22%20y%3D%222%22%20width%3D%2230%22%20height%3D%2236%22%20rx%3D%224%22%20fill%3D%22%23d6370f%22/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Nanum Gothic";src:url("fonts/NanumGothic-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Nanum Gothic";src:url("fonts/NanumGothic-Bold.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Nanum Gothic";src:url("fonts/NanumGothic-ExtraBold.woff2") format("woff2");font-weight:800}
:root{--ink:#151515;--mute:#5f5d58;--line:#dcd8cf;--bg:#f4f3ef;--accent:#d6370f;--ok:#1d7a46;--warn:#ff8a00}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:400 15px/1.6 "Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border:1px solid var(--ink);background:#fff;font-weight:700;border-radius:8px}
.btn:hover{background:#f0eee9}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#b32c0a}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.hint{color:var(--mute);font-size:13px;margin:4px 0 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
/* 로그인 */
#login{display:grid;place-items:center;min-height:100%;padding:20px}
#login form{width:min(100%,380px);background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px}
#login h1{font-size:22px;font-weight:800;margin:0 0 4px}
#login input[type=password]{width:100%;min-height:48px;margin:18px 0 10px;padding:0 14px;border:1px solid var(--ink);border-radius:8px}
#login label{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:16px}
#login .btn{width:100%}
#loginMsg{color:var(--accent);font-size:14px;min-height:20px;margin-top:10px}
/* 화면 3칸 */
#app{display:none;height:100%;grid-template-columns:210px minmax(0,1fr) minmax(0,1.05fr)}
#app.on{display:grid}
nav{background:#151515;color:#fff;overflow:auto;padding:16px 10px}
nav .brand{font-weight:800;font-size:18px;padding:4px 10px 14px}
nav .brand small{display:block;font-weight:400;font-size:12px;opacity:.7}
nav a{display:block;color:#fff;text-decoration:none;padding:10px 12px;border-radius:8px;font-weight:700}
nav a:hover{background:#2a2a2a}
nav a[aria-current]{background:var(--accent)}
nav .sep{border-top:1px solid #333;margin:10px 0}
nav .out{opacity:.75;font-weight:400}
#mid{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
#body{flex:1;overflow:auto;padding:22px 22px 30px}
#body h2{font-size:21px;font-weight:800;margin:0 0 4px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 16px 6px;margin:16px 0}
.card h3{font-size:16px;font-weight:800;margin:0 0 10px}
.fld{border-top:1px dashed var(--line);padding:12px 0}
.card h3 + .fld{border-top:0;padding-top:2px}
.fld .lb{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--mute);margin-bottom:6px}
.fld .tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:#fff1e3;color:#a85400}
.fld .also{font-size:11px;color:var(--mute);font-weight:400}
.fld textarea{width:100%;min-height:44px;padding:9px 11px;border:1px solid #bdb8ad;border-radius:8px;resize:vertical;line-height:1.55;background:#fff}
.fld textarea:focus,.fld input:focus,.fld select:focus{outline:3px solid #ffcf9e;border-color:var(--warn)}
.fld.changed textarea{border-color:var(--warn);background:#fffaf3}
.fld .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.imgf{display:grid;grid-template-columns:140px 1fr;gap:14px;align-items:center}
.thumb{width:140px;aspect-ratio:4/3;border-radius:8px;border:1px solid var(--line);background:#e2e0d9 center/cover no-repeat;display:grid;place-items:center;color:var(--mute);font-size:12px;text-align:center}
.wk{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
.wk:first-child{border-top:0}
.wk .thumb{width:110px}
.wk input,.wk select{width:100%;min-height:38px;padding:0 10px;border:1px solid #bdb8ad;border-radius:8px;background:#fff}
.wk .g2{display:grid;grid-template-columns:1fr 150px;gap:8px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:26px;font-weight:800}
.stat span{color:var(--mute);font-size:13px}
.hist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.hist:first-of-type{border-top:0}
.hist small{display:block;color:var(--mute)}
.empty{color:var(--mute);padding:10px 0 14px}
/* 저장 막대 */
.savebar{display:flex;align-items:center;gap:10px;padding:12px 22px;border-top:1px solid var(--line);background:#fff}
.savebar .msg{flex:1;font-weight:700;color:var(--mute)}
.savebar.dirty .msg{color:#a85400}
/* 미리보기 */
#pv{display:flex;flex-direction:column;min-height:0;background:#e9e7e1}
#pv .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13px;color:var(--mute);border-bottom:1px solid var(--line);background:#fff}
#pv .bar b{color:var(--ink)}
#pv iframe{flex:1;width:100%;border:0;background:#fff}
#pvBtn,#pvClose{display:none}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#151515;color:#fff;padding:12px 18px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#errbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:98;place-items:center;padding:20px}
#errbox.on{display:grid}
#errbox div{background:#fff;border-radius:12px;padding:22px;max-width:420px}
#errbox p{margin:0 0 14px}
.practice{background:#fff1e3;color:#a85400;font-weight:700;font-size:13px;padding:8px 22px;border-bottom:1px solid #ffd9b0}
@media (max-width:1100px){
  #app{grid-template-columns:180px minmax(0,1fr)}
  #pv{display:none;position:fixed;inset:0;z-index:50}
  #pv.on{display:flex}
  #pvBtn,#pvClose{display:inline-flex}
}
@media (max-width:700px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  nav{display:flex;gap:4px;overflow-x:auto;padding:8px;white-space:nowrap}
  nav .brand,nav .sep{display:none}
  nav a{padding:8px 10px;font-size:13px}
  #body{padding:16px}
  .imgf{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .savebar{padding:10px 16px;flex-wrap:wrap}
}
</style>
</head>
<body>
<div id="login">
  <form id="loginForm" autocomplete="on">
    <h1>천호산업 홈페이지 관리</h1>
    <p class="hint">관리자 비밀번호를 넣어 주세요.<br>(수정요청 접수 비밀번호와는 다릅니다)</p>
    <input id="pw" type="password" autocomplete="current-password" aria-label="관리자 비밀번호" placeholder="비밀번호">
    <label><input id="keep" type="checkbox"> 이 기기에서 로그인 유지</label>
    <button class="btn pri" type="submit">들어가기</button>
    <div id="loginMsg" role="status"></div>
  </form>
</div>

<div id="app">
  <nav id="nav" aria-label="관리 메뉴"></nav>
  <div id="mid">
    <div id="practice" class="practice" hidden>연습 모드입니다. 저장한 내용은 이 브라우저에만 남고 홈페이지에는 반영되지 않습니다.</div>
    <div id="body"></div>
    <div class="savebar" id="savebar">
      <span class="msg" id="saveMsg">바꾼 내용 없음</span>
      <button class="btn" id="pvBtn" type="button">홈페이지 미리보기</button>
      <button class="btn" id="undo" type="button" disabled>되돌리기</button>
      <button class="btn pri" id="save" type="button" disabled>저장하기</button>
    </div>
  </div>
  <section id="pv" aria-label="홈페이지 미리보기">
    <div class="bar"><span>미리보기 · <b id="pvName">홈</b> (저장 전 내용이 보입니다)</span><span style="flex:1"></span><button class="btn sm" id="pvClose" type="button">닫기</button></div>
    <iframe id="frame" src="about:blank" title="홈페이지 미리보기"></iframe>
  </section>
</div>
<input id="file" type="file" accept="image/*" hidden>
<div id="toast" role="status"></div>
<div id="errbox" role="alertdialog"><div><p id="errText"></p><button class="btn pri" type="button" onclick="location.reload()">새로 고침</button></div></div>

<script>
(function(){
'use strict';
var API_URL=''; // Apps Script 웹 앱 주소 (…/exec). 비어 있으면 연습 모드
var PRACTICE=!API_URL, LS='cheonho_admin_practice', PWK='cheonho_admin_pw';
var PAGES=[['index.html','홈'],['about.html','회사 소개'],['products.html','가공 품목'],['process.html','설비·공정'],['works.html','제작 사례'],['contact.html','오시는 길·문의']];
var COMMON_GROUPS={'맨 아래 정보':1,'전화 상담 띠':1};
var CATS=[['diary','다이어리·수첩'],['binder','바인더·파일'],['clear','비닐커버'],['case','케이스'],['etc','기타']];
var PW='', SAVED=null, DRAFT=null, DEF=null, VIEW='home', HISTS=[], FOCUS='', started=false;

function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function norm(c){c=clone(c||{});delete c.updated;c.texts=c.texts||{};c.images=c.images||{};c.works=Array.isArray(c.works)?c.works:[];return c;}
function same(a,b){return JSON.stringify(a)===JSON.stringify(b);}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on');},3200);}
function showErr(t){$('#errText').textContent=t;$('#errbox').classList.add('on');}
function photo(v,sz){if(!v)return '';if(/^(data:|https?:|images\/)/.test(v))return v;return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(v)+'&sz=w'+(sz||600);}

/* ---------- 서버 ---------- */
function retry(fn,tries){var wait=600;return new Promise(function(ok,no){(function go(n){fn().then(ok,function(e){if(n<=1)return no(e);setTimeout(function(){go(n-1);},wait);wait*=1.6;});})(tries||4);});}
function apiGet(){
  if(PRACTICE){var c=null;try{c=JSON.parse(localStorage.getItem(LS)||'null');}catch(e){}
    return c?Promise.resolve(c):fetch('content.json?v='+Date.now()).then(function(r){return r.json();});}
  return retry(function(){return fetch(API_URL+'?action=content&t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(j){if(!j||j.ok===false)throw new Error('bad');return j;});});
}
function api(body,tries){
  body.password=PW;
  return retry(function(){return fetch(API_URL,{method:'POST',body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});},tries||3);
}

/* ---------- 로그인 ---------- */
function startApp(){
  $('#login').style.display='none';$('#app').classList.add('on');
  if(PRACTICE)$('#practice').hidden=false;
  Promise.all([apiGet(),readPages()]).then(function(r){
    SAVED=norm(r[0]);DRAFT=clone(SAVED);DEF=r[1];
    return loadHist();
  }).then(function(){
    window.addEventListener('hashchange',route);route();
  }).catch(function(e){
    console.error(e);showErr('홈페이지 내용을 불러오지 못했어요. 인터넷 연결을 확인하고 새로 고침해 주세요. (이 상태로는 저장할 수 없어요)');
  });
}
$('#loginForm').addEventListener('submit',function(e){
  e.preventDefault();var pw=$('#pw').value;
  if(PRACTICE){startApp();return;}
  if(!pw){$('#loginMsg').textContent='비밀번호를 넣어 주세요.';return;}
  $('#loginMsg').textContent='확인하는 중…';PW=pw;
  api({action:'login'},2).then(function(j){
    if(!j.ok){$('#loginMsg').textContent=j.error||'비밀번호가 맞지 않습니다.';return;}
    try{($('#keep').checked?localStorage:sessionStorage).setItem(PWK,pw);}catch(e){}
    startApp();
  }).catch(function(){$('#loginMsg').textContent='서버에 연결하지 못했어요. 잠시 후 다시 해 주세요.';});
});
(function(){var s='';try{s=localStorage.getItem(PWK)||sessionStorage.getItem(PWK)||'';}catch(e){}
  if(PRACTICE){$('#pw').placeholder='연습 모드 — 비밀번호 없이 들어가기';}
  else if(s){PW=s;api({action:'login'},2).then(function(j){if(j.ok)startApp();else{try{localStorage.removeItem(PWK);sessionStorage.removeItem(PWK);}catch(e){}}}).catch(function(){});}
})();

/* ---------- 홈페이지 HTML 에서 고칠 칸 찾기 ---------- */
function plain(el){var h=el.innerHTML.replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'');var t=document.createElement('textarea');t.innerHTML=h;return t.value.replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').trim();}
function readPages(){
  return Promise.all(PAGES.map(function(p){return fetch(p[0]+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();});})).then(function(htmls){
    var D={tx:{},img:{},pages:{}};
    htmls.forEach(function(h,i){
      var file=PAGES[i][0],doc=new DOMParser().parseFromString(h,'text/html'),list=[];
      doc.querySelectorAll('[data-t],[data-img]').forEach(function(el){
        if(el.hasAttribute('data-img')){var k=el.getAttribute('data-img');
          if(!D.img[k])D.img[k]={label:el.getAttribute('data-tl')||k,page:file,def:el.tagName==='IMG'?el.getAttribute('src'):'',pages:[]};
          if(D.img[k].pages.indexOf(file)<0)D.img[k].pages.push(file);
          list.push({img:k,group:groupOf(el)});return;}
        var k2=el.getAttribute('data-t');
        if(!D.tx[k2])D.tx[k2]={def:plain(el),kind:el.getAttribute('data-tl')||'문장',group:el.getAttribute('data-tg')||'',page:file,pages:[],at:file};
        if(D.tx[k2].pages.indexOf(file)<0)D.tx[k2].pages.push(file);
        list.push({tx:k2,group:el.getAttribute('data-tg')||''});
      });
      D.pages[file]=list;
    });
    return D;
  });
}
function groupOf(el){var s=el.closest('section');if(!s)return '';var h=s.querySelector('[data-tg]');return h?h.getAttribute('data-tg'):'';}
function pageName(f){for(var i=0;i<PAGES.length;i++)if(PAGES[i][0]===f)return PAGES[i][1];return f;}

/* ---------- 메뉴·화면 ---------- */
function drawNav(){
  var items=[['home','한눈에 보기']].concat(PAGES.map(function(p){return [p[0].replace('.html',''),p[1]];})).concat([['common','모든 페이지 공통']]);
  $('#nav').innerHTML='<div class="brand">천호산업<small>홈페이지 관리</small></div>'+items.map(function(it){
    return '<a href="#'+it[0]+'"'+(VIEW===it[0]?' aria-current="page"':'')+'>'+esc(it[1])+'</a>';}).join('')+
    '<div class="sep"></div><a href="./" target="_blank" rel="noopener" class="out">홈페이지 열기 ↗</a><a href="#" id="logout" class="out">로그아웃</a>';
  $('#logout').addEventListener('click',function(e){e.preventDefault();try{localStorage.removeItem(PWK);sessionStorage.removeItem(PWK);}catch(x){}location.href=location.pathname;});
}
function route(){
  var h=(location.hash||'#home').slice(1);
  if(!/^(home|common|index|about|products|process|works|contact)$/.test(h))h='home';
  VIEW=h;FOCUS='';drawNav();
  try{draw();}catch(e){console.error(e);showErr('화면을 그리는 중 문제가 생겼어요. 새로 고침(Ctrl+Shift+R) 해 주세요.');}
  loadPreview();updateBar();
}
function draw(){
  var b=$('#body');
  if(VIEW==='home')return drawHome(b);
  if(VIEW==='common')return drawFields(b,'모든 페이지 공통','여러 페이지에 똑같이 나오는 곳입니다. 한 번 고치면 모든 페이지가 함께 바뀝니다.',commonList());
  var file=VIEW+'.html',name=pageName(file);
  var list=(DEF.pages[file]||[]).filter(function(f){return !(f.tx&&COMMON_GROUPS[DEF.tx[f.tx].group]);});
  drawFields(b,name,'이 페이지에서 고칠 수 있는 글과 사진입니다. 칸을 누르면 오른쪽 미리보기에서 그 자리를 보여 줍니다.',list,VIEW==='works');
}
function commonList(){var seen={},out=[];Object.keys(DEF.pages).forEach(function(f){DEF.pages[f].forEach(function(x){if(x.tx&&COMMON_GROUPS[DEF.tx[x.tx].group]&&!seen[x.tx]){seen[x.tx]=1;out.push(x);}});});return out;}

function drawFields(b,title,desc,list,withWorks){
  var html='<h2>'+esc(title)+'</h2><p class="hint">'+esc(desc)+'</p>';
  if(withWorks)html+=worksCard();
  var groups=[],gi={},seen={};
  list.forEach(function(x){var key=x.tx||('img:'+x.img);if(seen[key])return;seen[key]=1;
    var g=x.group||'그 밖에';if(gi[g]==null){gi[g]=groups.length;groups.push({name:g,items:[]});}groups[gi[g]].items.push(x);});
  groups.forEach(function(g){html+='<div class="card"><h3>'+esc(g.name)+'</h3>'+g.items.map(function(x){return x.img?imgField(x.img):txField(x.tx);}).join('')+'</div>';});
  b.innerHTML=html;b.scrollTop=0;
  bindFields(b);if(withWorks)bindWorks(b);
}
function also(pages){var cur=VIEW+'.html';var o=pages.filter(function(p){return p!==cur;});return o.length&&VIEW!=='common'?'<span class="also">('+o.map(pageName).join('·')+'에도 함께 나옴)</span>':'';}
function txField(k){
  var d=DEF.tx[k];if(!d)return '';
  var v=DRAFT.texts[k]!=null?DRAFT.texts[k]:d.def,ch=DRAFT.texts[k]!=null;
  var rows=Math.min(8,Math.max(1,Math.ceil(v.length/38)+(v.split('\n').length-1)));
  return '<div class="fld'+(ch?' changed':'')+'" data-k="'+k+'"><div class="lb">'+esc(d.kind)+(ch?' <span class="tag">바꾼 문구</span>':'')+also(d.pages)+'</div>'+
    '<textarea rows="'+rows+'" data-tx="'+k+'">'+esc(v)+'</textarea>'+
    '<div class="row">'+(ch?'<button class="btn sm" type="button" data-def="'+k+'">기본 문구로</button>':'')+(/[○]/.test(v)?'<span class="hint">○ 표시는 아직 채우지 않은 빈칸이에요.</span>':'')+'</div></div>';
}
function imgField(k){
  var d=DEF.img[k],v=DRAFT.images[k],src=v?photo(v,600):(d.def||'');
  return '<div class="fld" data-k="img:'+k+'"><div class="lb">'+esc(d.label)+(v?' <span class="tag">바꾼 사진</span>':'')+also(d.pages)+'</div><div class="imgf">'+
    '<div class="thumb" style="'+(src?'background-image:url(&quot;'+esc(src)+'&quot;)':'')+'">'+(src?'':'사진 없음<br>(색 견본이 보임)')+'</div>'+
    '<div><div class="row" style="margin-top:0"><button class="btn sm pri" type="button" data-pick="'+k+'">사진 바꾸기</button>'+(v?'<button class="btn sm" type="button" data-imgdef="'+k+'">처음 사진으로</button>':'')+'</div>'+
    '<p class="hint">고르면 바로 올라가고 홈페이지에 반영됩니다. 가로로 긴 사진(4:3)이 잘 맞아요.</p></div></div></div>';
}
function bindFields(b){
  b.querySelectorAll('textarea[data-tx]').forEach(function(t){
    t.addEventListener('focus',function(){focus(t.dataset.tx);});
    t.addEventListener('input',function(){var k=t.dataset.tx,d=DEF.tx[k].def,v=t.value.replace(/\r/g,'');
      if(v.trim()===''||v.trim()===d.trim())delete DRAFT.texts[k];else DRAFT.texts[k]=v;
      var f=t.closest('.fld');f.classList.toggle('changed',DRAFT.texts[k]!=null);changed();});
  });
  b.querySelectorAll('[data-def]').forEach(function(x){x.addEventListener('click',function(){var k=x.dataset.def;delete DRAFT.texts[k];
    var f=x.closest('.fld');f.outerHTML=txField(k);bindFields(b.querySelector('[data-k="'+k+'"]').parentNode);focus(k);changed();});});
  b.querySelectorAll('[data-pick]').forEach(function(x){x.addEventListener('click',function(){focus('img:'+x.dataset.pick);pickPhoto(function(id){setImage(x.dataset.pick,id);});});});
  b.querySelectorAll('[data-imgdef]').forEach(function(x){x.addEventListener('click',function(){if(confirm('처음 사진(또는 색 견본)으로 되돌릴까요?'))setImage(x.dataset.imgdef,'');});});
  b.querySelectorAll('.fld[data-k^="img:"]').forEach(function(f){f.addEventListener('click',function(){focus(f.dataset.k);});});
}

/* ---------- 사진 올리기 ---------- */
var pickCb=null;
function pickPhoto(cb){pickCb=cb;$('#file').value='';$('#file').click();}
$('#file').addEventListener('change',function(e){var f=e.target.files[0];if(!f||!pickCb)return;var cb=pickCb;pickCb=null;readPhoto(f,cb);});
function readPhoto(file,cb){
  if(!/^image\//.test(file.type)){toast('사진 파일만 올릴 수 있어요.');return;}
  var RAW_MAX=7.5*1024*1024,OK=['image/jpeg','image/png','image/webp'].indexOf(file.type)>=0;
  var url=URL.createObjectURL(file),im=new Image();
  im.onerror=function(){URL.revokeObjectURL(url);toast('사진을 읽지 못했어요. JPG 나 PNG 로 바꿔서 올려 주세요.');};
  im.onload=function(){
    var w=im.naturalWidth,h=im.naturalHeight;
    function shrink(M,q){var s=Math.min(1,M/Math.max(w,h)),W=Math.round(w*s),H=Math.round(h*s),src=im,cw=w,ch=h;
      while(cw/2>=W){var t=document.createElement('canvas');t.width=Math.round(cw/2);t.height=Math.round(ch/2);var tx=t.getContext('2d');tx.imageSmoothingQuality='high';tx.drawImage(src,0,0,t.width,t.height);src=t;cw=t.width;ch=t.height;}
      var c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');x.imageSmoothingQuality='high';x.fillStyle='#FFF';x.fillRect(0,0,W,H);x.drawImage(src,0,0,W,H);return c.toDataURL('image/jpeg',q);}
    URL.revokeObjectURL(url);
    if(PRACTICE){cb(shrink(1600,.85));return;}
    function send(b64,mime){
      toast('사진을 올리는 중이에요…');
      api({action:'upload',name:(file.name||'photo').replace(/\.[^.]+$/,'')+(mime==='image/png'?'.png':mime==='image/webp'?'.webp':'.jpg'),mime:mime,data:b64},2).then(function(j){
        if(!j.ok){toast(j.error||'사진을 올리지 못했어요.');return;}cb(j.id);
      }).catch(function(){toast('인터넷 연결이 불안정해서 사진을 올리지 못했어요.');});}
    if(file.type==='image/png')toast('투명한 배경은 흰색으로 바뀔 수 있어요.');
    if(OK&&file.size<=RAW_MAX){var r=new FileReader();r.onload=function(){send(String(r.result).split(',')[1],file.type);};r.readAsDataURL(file);return;}
    var du=shrink(6000,.95);if(du.length*.75>RAW_MAX)du=shrink(5000,.93);if(du.length*.75>RAW_MAX)du=shrink(4000,.92);
    send(du.split(',')[1],'image/jpeg');
  };
  im.src=url;
}
/* 사진 칸은 고르면 바로 저장 (다른 칸의 저장 안 한 문구는 그대로 남겨 둠) */
function setImage(k,id){
  var next=clone(SAVED),old=SAVED.images[k];
  if(id)next.images[k]=id;else delete next.images[k];
  saveContent(next,(id?'사진 바꾸기: ':'처음 사진으로: ')+DEF.img[k].label).then(function(ok){
    if(!ok)return;
    if(id)DRAFT.images[k]=id;else delete DRAFT.images[k];
    if(old&&!PRACTICE&&!/^(data:|https?:)/.test(old))api({action:'trash',ids:[old]},1).catch(function(){});
    var f=document.querySelector('.fld[data-k="img:'+k+'"]');if(f){f.outerHTML=imgField(k);bindFields($('#body'));}
    focus('img:'+k);toast(id?'사진을 바꿨어요. 홈페이지에 반영됐어요.':'처음 사진으로 돌렸어요.');
  });
}

/* ---------- 제작 사례 ---------- */
function worksCard(){
  var W=DRAFT.works;
  return '<div class="card" id="worksCard"><h3>제작 사례 목록 ('+W.length+'개)</h3><p class="hint" style="margin:-4px 0 10px">사진을 넣고 이름·품목·소재를 적어 주세요. ▲▼로 순서를 바꾸고, 다 고친 뒤 아래 [저장하기]를 누르면 홈페이지에 나옵니다.</p>'+
  '<div class="row" style="margin-bottom:10px"><button class="btn sm pri" type="button" id="wAdd">+ 사례 추가</button></div>'+
  W.map(function(w,i){var src=photo(w.img,400);
    return '<div class="wk" data-i="'+i+'"><div><div class="thumb" style="'+(src?'background-image:url(&quot;'+esc(src)+'&quot;)':'')+'">'+(src?'':'사진 없음')+'</div>'+
    '<div class="row"><button class="btn sm" type="button" data-wp="'+i+'">'+(src?'사진 바꾸기':'사진 넣기')+'</button></div></div>'+
    '<div><div class="g2"><input data-wf="name" data-i="'+i+'" value="'+esc(w.name)+'" placeholder="이름 (예: 다이어리 표지)" aria-label="사례 이름">'+
    '<select data-wf="cat" data-i="'+i+'" aria-label="품목">'+CATS.map(function(c){return '<option value="'+c[0]+'"'+(w.cat===c[0]?' selected':'')+'>'+c[1]+'</option>';}).join('')+'</select></div>'+
    '<input data-wf="spec" data-i="'+i+'" value="'+esc(w.spec)+'" placeholder="소재·후가공 (예: 유색 PVC · 금박)" aria-label="소재·후가공">'+
    '<div class="row"><button class="btn sm" type="button" data-wu="'+i+'"'+(i===0?' disabled':'')+'>▲</button><button class="btn sm" type="button" data-wd="'+i+'"'+(i===W.length-1?' disabled':'')+'>▼</button>'+
    (w.img?'<button class="btn sm" type="button" data-wx="'+i+'">사진 빼기</button>':'')+'<button class="btn sm" type="button" data-wdel="'+i+'">삭제</button></div></div></div>';}).join('')+'</div>';
}
function bindWorks(b){
  function redraw(){var c=$('#worksCard');c.outerHTML=worksCard();bindWorks($('#body'));focus('works');changed();}
  $('#wAdd').onclick=function(){if(DRAFT.works.length>=60){toast('제작 사례는 60개까지 넣을 수 있어요.');return;}DRAFT.works.unshift({cat:'diary',name:'',spec:'',img:''});redraw();};
  b.querySelectorAll('[data-wf]').forEach(function(x){x.addEventListener('focus',function(){focus('works');});
    x.addEventListener(x.tagName==='SELECT'?'change':'input',function(){DRAFT.works[+x.dataset.i][x.dataset.wf]=x.value;changed();});});
  b.querySelectorAll('[data-wu]').forEach(function(x){x.onclick=function(){var i=+x.dataset.wu,W=DRAFT.works;W.splice(i-1,0,W.splice(i,1)[0]);redraw();};});
  b.querySelectorAll('[data-wd]').forEach(function(x){x.onclick=function(){var i=+x.dataset.wd,W=DRAFT.works;W.splice(i+1,0,W.splice(i,1)[0]);redraw();};});
  b.querySelectorAll('[data-wdel]').forEach(function(x){x.onclick=function(){var w=DRAFT.works[+x.dataset.wdel];if(!confirm('「'+(w.name||'이름 없음')+'」 사례를 삭제할까요? (저장하기를 눌러야 홈페이지에서 빠집니다)'))return;DRAFT.works.splice(+x.dataset.wdel,1);redraw();};});
  b.querySelectorAll('[data-wx]').forEach(function(x){x.onclick=function(){DRAFT.works[+x.dataset.wx].img='';redraw();};});
  b.querySelectorAll('[data-wp]').forEach(function(x){x.onclick=function(){var i=+x.dataset.wp;pickPhoto(function(id){DRAFT.works[i].img=id;redraw();toast('사진을 넣었어요. [저장하기]를 눌러야 홈페이지에 나옵니다.');});};});
}

/* ---------- 한눈에 보기 ---------- */
function loadHist(){
  if(PRACTICE){HISTS=[];return Promise.resolve();}
  return api({action:'history'},2).then(function(j){HISTS=j.ok?j.items:[];}).catch(function(){HISTS=[];});
}
function drawHome(b){
  var nt=Object.keys(SAVED.texts).length,ni=Object.keys(SAVED.images).length;
  b.innerHTML='<h2>한눈에 보기</h2><p class="hint">왼쪽 메뉴는 홈페이지 메뉴와 같은 순서입니다. 고칠 페이지를 고르세요.</p>'+
  '<div class="stats"><div class="stat"><b>'+SAVED.works.length+'</b><span>제작 사례</span></div><div class="stat"><b>'+nt+'</b><span>바꾼 문구</span></div><div class="stat"><b>'+ni+'</b><span>바꾼 사진</span></div></div>'+
  '<div class="card"><h3>자주 하는 일</h3><div class="row" style="flex-wrap:wrap;display:flex;gap:8px;margin-bottom:12px"><a class="btn" href="#works">제작 사례 올리기</a><a class="btn" href="#index">첫 화면 고치기</a><a class="btn" href="#common">상담 시간·사업자 정보</a><a class="btn" href="#products">가공 품목 사진</a></div></div>'+
  '<div class="card"><h3>저장 기록</h3><p class="hint" style="margin:-4px 0 8px">저장할 때마다 바로 전 상태를 남겨 둡니다. 잘못 고쳤다면 되돌릴 수 있어요.</p>'+
  (PRACTICE?'<div class="empty">연습 모드에서는 저장 기록이 남지 않아요.</div>':HISTS.length?HISTS.map(function(h,i){return '<div class="hist"><span>'+esc(new Date(h.time).toLocaleString('ko-KR'))+'<small>'+esc(h.note)+'</small></span><button class="btn sm" type="button" data-rs="'+i+'">이 저장 바로 전으로</button></div>';}).join(''):'<div class="empty">아직 저장 기록이 없어요.</div>')+'</div>'+
  '<div class="card"><h3>여기서 고칠 수 없는 것</h3><p class="hint" style="margin:0 0 12px">색·글꼴·배치, 메뉴 구성, 전화번호 버튼, 공정 그림은 제작사(디엔에이랩스)에 수정 요청해 주세요.</p></div>';
  b.querySelectorAll('[data-rs]').forEach(function(x){x.onclick=function(){
    if(isDirty()&&!confirm('저장하지 않은 바뀐 내용이 있어요. 버리고 되돌릴까요?'))return;
    if(!confirm('이 저장 바로 전 상태로 되돌릴까요? 지금 내용도 저장 기록에 남습니다.'))return;
    api({action:'restore',time:HISTS[+x.dataset.rs].time}).then(function(j){
      if(!j.ok){toast(j.error||'되돌리지 못했어요.');return;}
      return apiGet().then(function(c){SAVED=norm(c);DRAFT=clone(SAVED);return loadHist();}).then(function(){route();toast('되돌렸어요.');});
    }).catch(function(){toast('서버에 연결하지 못했어요.');});};});
}

/* ---------- 저장 ---------- */
function isDirty(){return !same(DRAFT,SAVED);}
function changed(){updateBar();pushPreview();}
function updateBar(){var d=SAVED&&isDirty();$('#savebar').classList.toggle('dirty',!!d);$('#saveMsg').textContent=d?'저장하지 않은 바뀐 내용이 있어요':'바꾼 내용 없음';$('#undo').disabled=!d;$('#save').disabled=!d;}
function summary(){var n=[];var a=Object.keys(DRAFT.texts).concat(Object.keys(SAVED.texts)).filter(function(k,i,s){return s.indexOf(k)===i&&DRAFT.texts[k]!==SAVED.texts[k];});
  if(a.length)n.push('문구 '+a.length+'곳');if(!same(DRAFT.works,SAVED.works))n.push('제작 사례');return n.join(', ')||'저장';}
function saveContent(c,note){
  if(PRACTICE){try{localStorage.setItem(LS,JSON.stringify(c));}catch(e){toast('브라우저 저장 공간이 모자라요.');return Promise.resolve(false);}SAVED=norm(c);updateBar();return Promise.resolve(true);}
  toast('저장하는 중이에요…');
  return api({action:'save',content:c,note:note}).then(function(j){
    if(!j.ok){toast(j.error||'저장하지 못했어요.');return false;}
    SAVED=norm(c);updateBar();loadHist();return true;
  }).catch(function(){toast('인터넷 연결이 불안정해서 저장하지 못했어요. 다시 눌러 주세요.');return false;});
}
$('#save').addEventListener('click',function(){var b=this;b.disabled=true;saveContent(clone(DRAFT),summary()).then(function(ok){if(ok){toast(PRACTICE?'저장했어요 (연습 모드).':'저장했어요. 홈페이지에 반영됐어요. (1~5분 안에 모두에게 보여요)');if(VIEW==='home')route();}updateBar();});});
$('#undo').addEventListener('click',function(){if(!confirm('저장하지 않은 바뀐 내용을 모두 되돌릴까요?'))return;DRAFT=clone(SAVED);route();});
window.addEventListener('beforeunload',function(e){if(SAVED&&isDirty()){e.preventDefault();e.returnValue='';}});

/* ---------- 미리보기 ---------- */
function curPage(){if(VIEW==='home'||VIEW==='common')return 'index.html';return VIEW+'.html';}
function loadPreview(){
  var f=$('#frame'),page=curPage();
  if(VIEW==='common')page=FOCUS&&DEF.tx[FOCUS]?DEF.tx[FOCUS].page:'index.html';
  $('#pvName').textContent=pageName(page);
  if(f.dataset.page===page)return pushPreview();
  f.dataset.page=page;f.dataset.ready='';
  f.onload=function(){f.dataset.ready='1';pushPreview();};
  f.src=page+'?preview&v='+Date.now();
}
var pt=null;
function pushPreview(){clearTimeout(pt);pt=setTimeout(function(){var f=$('#frame');if(f.dataset.ready!=='1')return;try{f.contentWindow.CH_PREVIEW&&f.contentWindow.CH_PREVIEW(DRAFT,FOCUS);}catch(e){}},120);}
function focus(k){FOCUS=k;if(VIEW==='common'){var p=DEF.tx[k]?DEF.tx[k].page:'index.html';if($('#frame').dataset.page!==p)return loadPreview();}pushPreview();}
$('#pvBtn').addEventListener('click',function(){$('#pv').classList.add('on');pushPreview();});
$('#pvClose').addEventListener('click',function(){$('#pv').classList.remove('on');});
})();
</script>
